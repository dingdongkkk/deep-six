<title>DEEP SIX</title>
<style>
  /* Single committed visual world: a 1980s CRT terminal in a flooded facility.
     Every colour is painted explicitly so the page holds on any host ground. */
  :root {
    --ground: #000000;
    --phosphor: #00ff41;
    --phosphor-dim: #00a82c;
    --phosphor-deep: #00521c;
    --alarm: #ff3355;
    --specimen: #ff4dd2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--ground);
    color: var(--phosphor);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    overflow: hidden;
  }

  #stage {
    position: relative;
    image-rendering: pixelated;
    box-shadow: 0 0 0 2px var(--phosphor-deep), 0 0 46px rgba(0, 255, 65, 0.16);
  }

  #screen {
    display: block;
    image-rendering: pixelated;
    background: var(--ground);
  }

  #crt, #vignette, #flicker { position: absolute; inset: 0; pointer-events: none; }

  #crt {
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.32) 3px, rgba(0,0,0,0.32) 4px),
      repeating-linear-gradient(to right,
        rgba(255,0,0,0.05), rgba(0,255,0,0.03) 1px, rgba(0,0,255,0.05) 2px);
    mix-blend-mode: multiply;
  }

  #vignette {
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 52%, rgba(0,0,0,0.25) 88%, rgba(0,0,0,0.45) 100%);
  }

  #flicker {
    background: rgba(0, 255, 65, 0.03);
    animation: flicker 5.5s infinite steps(1);
  }

  @keyframes flicker {
    0%, 92%, 100% { opacity: 0.25; }
    93% { opacity: 0.6; }
    94% { opacity: 0.1; }
    95% { opacity: 0.55; }
    96% { opacity: 0.2; }
  }

  /* Facility placard: the viewer arrives with no briefing, so give them one. */
  .placard {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 20px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--phosphor-dim);
    text-align: center;
  }

  .placard b { color: var(--phosphor); font-weight: 600; }
  .placard .warn { color: var(--alarm); }
  .placard .spec { color: var(--specimen); }

  @media (prefers-reduced-motion: reduce) {
    #flicker { animation: none; }
  }
</style>

<div id="stage">
  <canvas id="screen" width="320" height="240"></canvas>
  <div id="crt"></div>
  <div id="vignette"></div>
  <div id="flicker"></div>
</div>

<p class="placard">
  <span><b>WASD</b> swim</span>
  <span><b>Shift</b> sprint &mdash; fast but loud</span>
  <span><b>Space</b> dash &mdash; once per dive</span>
  <span><b>M</b> mute</span>
  <span><b>R</b> retry</span>
  <span class="warn">3 consoles, 3 puzzles, 1 exit</span>
  <span class="spec">Every keycard broadcasts your position</span>
</p>

<script type="module" src="src/main.js"></script>
